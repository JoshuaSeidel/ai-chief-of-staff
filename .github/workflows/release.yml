name: Create Release

on:
  # Create releases only after Docker images are built successfully.
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  create-release:
    runs-on: ubuntu-latest
    # Automatic releases are created only after the main Docker build succeeds.
    # Manual dispatch is kept for recovery if a release needs to be recreated.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    permissions:
      actions: read
      checks: read
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Wait for CodeQL checks
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.payload.workflow_run.head_sha;
            const requiredNames = new Set([
              'Analyze (actions)',
              'Analyze (go)',
              'Analyze (javascript-typescript)',
              'Analyze (python)'
            ]);
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            for (let attempt = 1; attempt <= 30; attempt += 1) {
              const { data } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref,
                per_page: 100
              });
              const checksByName = new Map(
                data.check_runs
                  .filter((run) => requiredNames.has(run.name))
                  .map((run) => [run.name, run])
              );
              const missing = [...requiredNames].filter((name) => !checksByName.has(name));
              const pending = [...checksByName.values()].filter((run) => run.status !== 'completed');
              const failed = [...checksByName.values()].filter((run) => run.status === 'completed' && run.conclusion !== 'success');

              core.info(`CodeQL check wait attempt ${attempt}: ${checksByName.size}/${requiredNames.size} found, ${pending.length} pending, ${failed.length} failed`);

              if (failed.length > 0) {
                core.setFailed(`CodeQL did not pass: ${failed.map((run) => `${run.name}=${run.conclusion}`).join(', ')}`);
                return;
              }

              if (missing.length === 0 && pending.length === 0) {
                core.info('All CodeQL checks passed for this commit.');
                return;
              }

              await sleep(10000);
            }

            core.setFailed('Timed out waiting for CodeQL checks to pass for this commit.');

      - name: Get version and repository info
        id: version
        run: |
          VERSION=$(node -p "require('./backend/package.json').version")
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG_NAME="v$VERSION"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "repo_lower=$REPO_LOWER" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
          echo "Tag: $TAG_NAME"
          echo "Repository: $REPO_LOWER"

      - name: Get commit info
        id: commit-info
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "hash=$COMMIT_HASH" >> $GITHUB_OUTPUT

      - name: Get recent commits for release notes
        id: commits
        run: |
          # Get commits since last tag, or last 10 commits if no tag
          if git describe --tags --abbrev=0 2>/dev/null; then
            LAST_TAG=$(git describe --tags --abbrev=0)
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" | head -20)
          else
            COMMITS=$(git log -10 --pretty=format:"- %s (%h)")
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check-release
        run: |
          TAG_NAME="${{ steps.version.outputs.tag }}"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG_NAME})
          
          if [ "$RESPONSE" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release ${TAG_NAME} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release ${TAG_NAME} does not exist (HTTP $RESPONSE)"
          fi

      - name: Create GitHub Release
        if: steps.check-release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## Release ${{ steps.version.outputs.tag }}

            ### Docker Images

            All images are available at `${{ env.REGISTRY }}/${{ steps.version.outputs.repo_lower }}` with multi-architecture support (linux/amd64, linux/arm64):

            #### Core Services
            ```bash
            # Backend API
            docker pull ${{ env.REGISTRY }}/${{ steps.version.outputs.repo_lower }}/aicos-backend:${{ steps.version.outputs.tag }}
            docker pull ${{ env.REGISTRY }}/${{ steps.version.outputs.repo_lower }}/aicos-backend:latest

            # Frontend
            docker pull ${{ env.REGISTRY }}/${{ steps.version.outputs.repo_lower }}/aicos-frontend:${{ steps.version.outputs.tag }}
            docker pull ${{ env.REGISTRY }}/${{ steps.version.outputs.repo_lower }}/aicos-frontend:latest
            ```

            #### Microservices
            ```bash
            # AI Intelligence Service
            docker pull ${{ env.REGISTRY }}/${{ steps.version.outputs.repo_lower }}/aicos-ai-intelligence:${{ steps.version.outputs.tag }}
            docker pull ${{ env.REGISTRY }}/${{ steps.version.outputs.repo_lower }}/aicos-ai-intelligence:latest

            # Pattern Recognition Service
            docker pull ${{ env.REGISTRY }}/${{ steps.version.outputs.repo_lower }}/aicos-pattern-recognition:${{ steps.version.outputs.tag }}
            docker pull ${{ env.REGISTRY }}/${{ steps.version.outputs.repo_lower }}/aicos-pattern-recognition:latest

            # Natural Language Parser
            docker pull ${{ env.REGISTRY }}/${{ steps.version.outputs.repo_lower }}/aicos-nl-parser:${{ steps.version.outputs.tag }}
            docker pull ${{ env.REGISTRY }}/${{ steps.version.outputs.repo_lower }}/aicos-nl-parser:latest

            # Voice Processor (Whisper)
            docker pull ${{ env.REGISTRY }}/${{ steps.version.outputs.repo_lower }}/aicos-voice-processor:${{ steps.version.outputs.tag }}
            docker pull ${{ env.REGISTRY }}/${{ steps.version.outputs.repo_lower }}/aicos-voice-processor:latest

            # Context Service (Go)
            docker pull ${{ env.REGISTRY }}/${{ steps.version.outputs.repo_lower }}/aicos-context-service:${{ steps.version.outputs.tag }}
            docker pull ${{ env.REGISTRY }}/${{ steps.version.outputs.repo_lower }}/aicos-context-service:latest

            # Integrations Service
            docker pull ${{ env.REGISTRY }}/${{ steps.version.outputs.repo_lower }}/aicos-integrations:${{ steps.version.outputs.tag }}
            docker pull ${{ env.REGISTRY }}/${{ steps.version.outputs.repo_lower }}/aicos-integrations:latest
            ```

            #### Monolith (Legacy - Deprecated)
            ```bash
            # All-in-one container (being phased out in favor of microservices)
            docker pull ${{ env.REGISTRY }}/${{ steps.version.outputs.repo_lower }}/aicos-monolith:${{ steps.version.outputs.tag }}
            docker pull ${{ env.REGISTRY }}/${{ steps.version.outputs.repo_lower }}/aicos-monolith:latest
            ```

            ### Deployment

            Use the `docker-compose.yml` from the repository for full microservices deployment:

            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd ai-chief-of-staff
            cp env.example .env
            # Edit .env and set AICOS_AUTH_TOKEN plus POSTGRES_PASSWORD first.
            docker compose up --build -d
            ```

            ### Recent Changes
            ${{ steps.commits.outputs.commits }}

            ---
            **Commit:** ${{ steps.commit-info.outputs.hash }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
